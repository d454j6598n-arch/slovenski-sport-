<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06182d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SLO Šport"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=10"><link rel="icon" href="icon-192.png?v=10"><link rel="manifest" href="manifest.webmanifest?v=10"><title>Slovenski Šport</title><style>
:root{color-scheme:dark;--blue:#168cff;--text:#f5f9ff;--soft:#b9d1e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071c35;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-2;background:url('ozadje-triglav.jpg') center center/cover no-repeat;filter:saturate(1.12) brightness(.96);transform:none}body:after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(2,18,38,.16),rgba(2,16,34,.14) 45%,rgba(2,16,34,.24))}.app{max-width:680px;margin:auto;padding:calc(30px + env(safe-area-inset-top)) 17px calc(115px + env(safe-area-inset-bottom))}.brand{letter-spacing:3px;color:#c1dcff;font-size:12px;font-weight:600}.hero h1{font-size:clamp(29px,8vw,42px);line-height:1.12;margin:18px 0 12px;letter-spacing:-1.2px}.hero h1 span{color:#55aaff}.sub{color:var(--soft);font-size:16px}.glass{background:rgba(5,42,91,.82);border:1px solid rgba(116,187,255,.48);box-shadow:0 8px 24px rgba(0,8,22,.12);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);border-radius:18px}.banner{padding:22px;margin:25px 0 16px}.banner.featured{height:190px;background:linear-gradient(90deg,rgba(1,20,50,.08),rgba(1,20,50,.03)),url("srce-slovenije.jpg") center/100% 100% no-repeat;border-color:rgba(88,174,255,.65);box-shadow:0 8px 26px rgba(0,8,30,.25)}.banner strong{font-size:21px}.banner p{color:var(--soft);margin-bottom:0}.notice{border-left:4px solid #4aaaff;border-radius:12px;background:rgba(5,46,99,.88);padding:13px 15px;font-size:13px;color:#dbeafd;margin:18px 0 24px;backdrop-filter:blur(1px)}h2{font-size:23px;margin:22px 0 16px}.search{display:block;width:100%;padding:16px;border-radius:15px;border:1px solid rgba(136,201,255,.52);background:rgba(5,41,88,.86);color:white;font-size:16px;outline:none;backdrop-filter:blur(1px)}.chips{display:flex;gap:8px;overflow-x:auto;padding:15px 0 17px;scrollbar-width:none}.chips button,.switch button{white-space:nowrap;border:1px solid rgba(132,194,255,.52);border-radius:30px;background:rgba(5,40,85,.86);color:#e2efff;padding:11px 14px;font-size:13px}.chips button.active,.switch button.active{background:#1489ff;border-color:#1489ff;color:white}.card{padding:18px;margin:12px 0}.top{display:flex;align-items:center;justify-content:space-between;color:#94ccff;font-size:13px}.card h3{font-size:19px;line-height:1.3;margin:14px 0}.card p{font-size:13px;color:#c5d9ed}.star{border:0;background:none;color:#ffcf50;font-size:28px}.tag{display:inline-block;background:rgba(65,123,183,.45);border-radius:30px;padding:6px 10px;font-size:11px;color:#cfe8ff}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:1px;padding:12px 4px calc(12px + env(safe-area-inset-bottom));background:rgba(3,19,42,.88);border-top:1px solid rgba(119,175,230,.25);backdrop-filter:blur(16px);z-index:3}.nav button{flex:1;min-width:0;border:0;background:none;color:#b7cbe1;font-size:10px;padding:3px 0}.nav button.active{color:#4facff;font-weight:700}.nav .ico{display:block;font-size:22px;margin-bottom:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{min-height:103px;padding:14px 6px;text-align:center;border-radius:17px;background:rgba(5,41,88,.84);border:1px solid rgba(126,188,250,.23);color:white}.tile .symbol{display:block;font-size:29px;margin-bottom:10px}.tile .name{font-size:12px}.rowitem{display:flex;align-items:center;gap:13px;padding:16px;margin:10px 0}.rowitem .symbol{font-size:24px}.rowitem .detail{flex:1}.rowitem .detail small{display:block;color:var(--soft);margin-top:4px}.rowitem .arrow{color:#8fc7ff}.switch{display:flex;gap:8px;margin:15px 0}.empty{padding:18px;color:#d4e5f5}.date{font-size:13px;color:#bcdcff}.section-head{margin:0 0 15px}#splash{position:fixed;inset:0;z-index:20;background:#06182d url('triglav.png') center center/cover no-repeat;transition:opacity .45s}#splash.hide{opacity:0;pointer-events:none}@media(prefers-reduced-motion:reduce){#splash{transition:none}}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #9ad3ff;outline-offset:3px}

.live-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.live-pill{font-size:12px;color:#fff;background:#b82e46;border-radius:20px;padding:6px 10px}.live-settings{padding:16px;margin:16px 0}.live-toggle{display:flex;align-items:center;justify-content:space-between;gap:14px}.live-toggle input{width:22px;height:22px;accent-color:#168cff}.live-match{padding:15px;margin:12px 0}.live-match h3{margin:9px 0;font-size:17px}.live-note{font-size:13px;line-height:1.5;color:#c4dafa}.live-score{font-weight:800;font-size:22px;letter-spacing:1px}.live-small{font-size:12px;color:#b4d3f4}.live-track{border:1px solid #5ca8ef;border-radius:12px;background:#0d4a83;color:white;padding:9px 12px;font-weight:600}.live-track.selected{background:#1c8aff}.live-preview{background:rgba(5,36,79,.9);border:1px solid #599de2;border-radius:17px;padding:16px;margin:15px 0}
.tvline{margin-top:13px;padding:12px;border:1px solid rgba(120,190,255,.36);border-radius:12px;background:rgba(2,26,61,.55);font-size:14px;line-height:1.6}.tvhelp{font-size:12px;color:#b8d3ee}.tvlink{display:inline-block;margin:12px 0 0 7px;color:#cce7ff;font-size:13px;text-decoration:underline}</style></head><body><div id="splash" aria-label="Začetni zaslon s Triglavom"></div><main class="app" id="app"></main><nav class="nav" id="nav" aria-label="Glavna navigacija"></nav><script>
const sports=[['⚽','Nogomet'],['🏀','Košarka'],['🏐','Odbojka'],['🤾','Rokomet'],['🏒','Hokej'],['🎿','Zimski športi'],['🚴','Kolesarstvo'],['🏃','Atletika'],['🏊','Plavanje'],['🎾','Tenis'],['🥋','Judo'],['🚣','Veslanje'],['🛶','Kajak / kanu'],['🏎️','Avtomoto'],['🏅','Ostali športi']];
const clubs=[['⚽','NK Olimpija Ljubljana','Nogomet'],['⚽','NK Maribor','Nogomet'],['🤾','RK Celje','Rokomet'],['🏐','ACH Volley Ljubljana','Odbojka'],['🏒','HK Olimpija Ljubljana','Hokej'],['🏀','KK Cedevita Olimpija','Košarka'],['🏀','KK Krka','Košarka'],['🏒','Triglav Kranj','Hokej']];
const examples=[{id:'e1',sport:'Košarka',icon:'🏀',title:'Slovenska reprezentanca – primer dogodka',kind:'Reprezentance'},{id:'e2',sport:'Nogomet',icon:'⚽',title:'Slovenska reprezentanca – primer dogodka',kind:'Reprezentance'},{id:'e3',sport:'Odbojka',icon:'🏐',title:'Slovenski klub – primer dogodka',kind:'Klubi'},{id:'e4',sport:'Kolesarstvo',icon:'🚴',title:'Slovenski kolesar – primer nastopa',kind:'Športniki'}];
let tab='Domov',filter='Vsi',q='',subtab='Reprezentance';let saved=[];try{saved=JSON.parse(localStorage.getItem('ss-saved-v5')||'[]')}catch{};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const navs=[['🏠','Domov'],['🇸🇮','Reprezentance'],['🏆','Klubi'],['🗓️','Koledar'],['🏅','Rezultati'],['⭐','Shranjeno']];
function buttons(items){return `<div class="chips">${items.map(x=>`<button data-filter="${esc(x)}" class="${filter===x?'active':''}">${esc(x)}</button>`).join('')}</div>`}
function card(e){return `<article class="card glass"><div class="top"><span>${e.icon} ${esc(e.sport)} · ${esc(e.kind)}</span><button class="star" data-save="${e.id}" aria-label="Shrani ali odstrani">${saved.includes(e.id)?'★':'☆'}</button></div><h3>${esc(e.title)}</h3><p>📅 Datum in ura še nista potrjena</p><p>📍 Prizorišče še ni določeno</p><span class="tag">Demonstracijski dogodek</span></article>`}
function listEvents(mode='all'){let a=examples.filter(e=>(filter==='Vsi'||e.sport===filter)&&(mode==='all'||e.kind===mode)&&(tab!=='Shranjeno'||saved.includes(e.id))&&(`${e.title} ${e.sport} ${e.kind}`.toLowerCase().includes(q)));return a.length?a.map(card).join(''):'<div class="glass empty">Za ta izbor trenutno ni potrjenih dogodkov.</div>'}
function home(){return `<section class="hero"><div class="brand">🇸🇮 SLOVENSKI ŠPORT</div><h1>Skupaj navijamo<br>za <span>Slovenijo.</span> 🇸🇮</h1><div class="sub">Vsi športi. Ena strast.</div></section><div class="banner glass featured" role="img" aria-label="Srce bije za Slovenijo 🇸🇮 — Reprezentance, klubi, posamezni športniki"></div><div class="notice">🧪 Preizkusna različica: prikazani dogodki so primeri, ne dejanski urniki. Koledar prikazuje ročno preverjene termine reprezentance iz NZS; končni nogometni rezultati so v rubriki Rezultati. Nogometne končne rezultate pridobivamo prek KickoffAPI, ko je povezava na voljo; obvestila še niso omogočena.</div><h2>Športni dogodki</h2><input id="search" class="search" placeholder="🔎 Poišči šport ali ekipo" value="${esc(q)}" aria-label="Iskanje">${buttons(['Vsi',...sports.map(s=>s[1])])}<div id="eventlist">${listEvents()}</div>`}
function sportsPage(){return `<h2 class="section-head">Športi</h2><input id="search" class="search" placeholder="🔎 Išči šport ..." value="${esc(q)}"><div class="grid" style="margin-top:18px">${sports.filter(s=>s[1].toLowerCase().includes(q)).map(s=>`<button class="tile" data-sport="${esc(s[1])}"><span class="symbol">${s[0]}</span><span class="name">${esc(s[1])}</span></button>`).join('')}</div>`}
function teams(){return `<h2>Slovenija 🇸🇮</h2><div class="switch"><button class="active">Reprezentance</button><button data-tab="Športi">Vsi športi</button></div><div class="banner glass"><strong>🇸🇮 Vse reprezentance na enem mestu</strong><p>Izberi šport in spremljaj slovenske ekipe.</p></div>${sports.map(s=>`<button class="rowitem glass" style="width:100%;color:white;text-align:left" data-sport="${esc(s[1])}"><span class="symbol">${s[0]}</span><span class="detail"><b>${esc(s[1])}</b><small>Slovenske reprezentance in selekcije</small></span><span class="arrow">›</span></button>`).join('')}`}
function clubsPage(){return `<h2>Klubi 🏆</h2><input id="search" class="search" placeholder="🔎 Poišči klub" value="${esc(q)}">${clubs.filter(c=>c[1].toLowerCase().includes(q)).map(c=>`<div class="rowitem glass"><span class="symbol">${c[0]}</span><span class="detail"><b>${esc(c[1])}</b><small>${esc(c[2])}</small></span><button class="star" data-save="${esc(c[1])}" aria-label="Shrani klub">${saved.includes(c[1])?'★':'☆'}</button></div>`).join('')}`}
let calendarSport="Vsi";
const calendarSports=["Vsi","Nogomet","Košarka","Odbojka","Hokej","Zimski športi","Kolesarstvo","Atletika","Tenis","Drugi športi"];
const verifiedFixtures=[{date:'13. 11. 2026',time:'20:45',title:'🇸🇮 Slovenija – Švica 🇨🇭',competition:'⚽ UEFA Liga narodov 2026',sport:'Nogomet',place:'Stadion Stožice, Ljubljana',tv:'TV-prenos še ni potrjen'},{date:'16. 11. 2026',time:'20:45',title:'🇲🇰 Severna Makedonija – Slovenija 🇸🇮',competition:'⚽ UEFA Liga narodov 2026',sport:'Nogomet',place:'National Arena Todor Proeski',tv:'TV-prenos še ni potrjen'}];
function calendar(){const items=verifiedFixtures.filter(x=>calendarSport==='Vsi'||x.sport===calendarSport);const sources=officialSources.filter(x=>calendarSport==='Vsi'||x.sport===calendarSport);return `<h2>📅 Koledar tekem</h2><div class="notice">🇸🇮 Objavljena termina A-reprezentance po NZS (preverjeno 8. 10. 2026). Koledar in TV-program se še ne osvežujeta samodejno.</div><h3>Izberi šport</h3><div class="chips" aria-label="Filter koledarja">${calendarSports.map(x=>`<button data-calendar-sport="${esc(x)}" class="${calendarSport===x?'active':''}">${esc(x)}</button>`).join('')}</div>${items.length?items.map(x=>`<article class="card glass"><div class="top"><span>${esc(x.competition)}</span><span class="tag">OBJAVLJEN TERMIN</span></div><h3>${x.title}</h3><p>📅 ${esc(x.date)} ob ${esc(x.time)}</p><p>📍 ${esc(x.place)}</p><div class="tvline">📺 <strong>TV-prenos:</strong> ${esc(x.tv)}<div class="tvhelp">Program preveri bližje datumu tekme.</div></div><a href="https://www.nzs.si/reprezentance/moski/a-reprezentanca/tekme" target="_blank" rel="noopener noreferrer" class="live-track" style="display:inline-block;text-decoration:none;margin-top:12px">Preveri na NZS ↗</a> <a href="https://sporter.si/ekipa/slovenija-1" target="_blank" rel="noopener noreferrer" class="tvlink">Preveri TV-prenos ↗</a></article>`).join(''):`<div class="glass empty">Za šport ${esc(calendarSport)} trenutno še nimamo preverjenih terminov. Preveri uradni razpored spodaj, če je na voljo.</div>`}<h2>Uradni razporedi</h2>${sources.length?sources.map(officialCard).join(''):'<div class="notice">Za ta šport še ni dodanega uradnega vira. Dodali ga bomo po preverjanju.</div>'}<div class="notice">📺 TV-programi se lahko spremenijo. Neobjavljen prenos ne pomeni, da tekme ne bo na televiziji.</div>`}

function favorites(){return `<h2>Priljubljeno ⭐</h2><p class="sub">Tukaj so tvoje shranjene ekipe in dogodki.</p>${clubs.filter(c=>saved.includes(c[1])).map(c=>`<div class="rowitem glass"><span class="symbol">${c[0]}</span><span class="detail"><b>${esc(c[1])}</b><small>${esc(c[2])}</small></span><button class="star" data-save="${esc(c[1])}">★</button></div>`).join('')}${listEvents()}${saved.length===0?'<div class="glass empty">Pritisni zvezdico pri ekipi ali dogodku, da ga shraniš.</div>':''}`}
const demoLive=[{id:'l1',icon:'⚽',sport:'Nogomet',match:'Slovenija 🇸🇮 – Nasprotnik',status:'Primer tekme'},{id:'l2',icon:'🏀',sport:'Košarka',match:'Slovenski klub – Nasprotnik',status:'Primer tekme'},{id:'l4',icon:'🏐',sport:'Odbojka',match:'Slovenska ekipa – Nasprotnik',status:'Primer tekme'},{id:'l3',icon:'🎾',sport:'Tenis',match:'Slovenski športnik – Nasprotnik',status:'Primer nastopa'}];
let tracked=[];try{tracked=JSON.parse(localStorage.getItem('ss-live-tracked')||'[]')}catch{};
let outside=false;try{outside=localStorage.getItem('ss-live-outside')==='true'}catch{};
const officialSources=[{icon:'⚽',sport:'Nogomet',name:'Nogometna zveza Slovenije (NZS)',url:'https://www.nzs.si/tekmovanja/',detail:'Uradni razporedi in rezultati slovenskih tekmovanj'},{icon:'🏀',sport:'Košarka',name:'Košarkarska zveza Slovenije (KZS)',url:'https://www.kzs.si/',detail:'Tekmovanja, razporedi, rezultati in statistika'},{icon:'🏐',sport:'Odbojka',name:'Odbojkarska zveza Slovenije (OZS)',url:'https://odbojka.si/',detail:'Uradne informacije o tekmah in tekmovanjih'}];
function officialCard(x){return `<article class="glass live-match"><div class="top"><span>${x.icon} ${esc(x.sport)}</span><span class="tag">URADNI VIR · zunanja stran</span></div><h3>${esc(x.name)}</h3><p class="live-note">${esc(x.detail)}</p><a href="${x.url}" target="_blank" rel="noopener noreferrer" class="live-track" style="display:inline-block;text-decoration:none;margin-top:8px">Odpri uradne rezultate ↗</a></article>`}
let footballData={state:'loading',matches:[],updated:null,message:''};
function safeTeam(v){if(typeof v==='string')return v.trim();if(v&&typeof v==='object'){for(const x of [v.name,v.displayName,v.shortName,v.team?.name])if(typeof x==='string'&&x.trim())return x.trim()}return ''}
function safeScore(v){if(typeof v==='number'&&Number.isInteger(v)&&v>=0)return v;if(typeof v==='string'&&/^\d{1,2}$/.test(v.trim()))return Number(v);return null}
function normalizeFootball(m){if(!m||typeof m!=='object')return null;const home=safeTeam(m.home),away=safeTeam(m.away),hs=safeScore(m.homeScore),as=safeScore(m.awayScore),date=new Date(m.date);if(!home||!away||hs===null||as===null||!Number.isFinite(date.getTime()))return null;const year=date.getUTCFullYear();if(year<2025||date.getTime()>Date.now()+86400000)return null;return {home,away,homeScore:hs,awayScore:as,date:m.date,league:safeTeam(m.league)||'Nogomet'}}
function footballCard(m){const d=new Date(m.date);return `<article class="card glass"><div class="top"><span>⚽ ${esc(m.league)}</span><span class="tag">KONČANO</span></div><h3>${esc(m.home)} – ${esc(m.away)}</h3><h2 style="font-size:32px;margin:8px 0">${m.homeScore} : ${m.awayScore}</h2><p>📅 ${esc(d.toLocaleDateString('sl-SI',{timeZone:'Europe/Ljubljana',day:'numeric',month:'long',year:'numeric'}))}</p><small>Vir: KickoffAPI · končni izid</small></article>`}
function resultsPage(){const f=footballData;let content=f.state==='loading'?'<div class="glass empty">⏳ Pridobivam nogometne rezultate …</div>':f.state==='error'?`<div class="notice">⚠️ ${esc(f.message)}. Preveri nastavitev povezave.</div>`:f.matches.length?f.matches.map(footballCard).join(''):'<div class="glass empty">Za izbrano obdobje ni potrjenih končnih tekem Slovenije v podatkih KickoffAPI.</div>';return `<h2>🏅 Končni rezultati</h2><div class="notice">⚽ Rezultati slovenske nogometne reprezentance iz KickoffAPI. Prikazani so samo zaključeni dvoboji z dejanskim rezultatom; drugi športi še niso povezani.</div>${content}<div class="notice">${f.updated?'Zadnje preverjanje: '+esc(new Date(f.updated).toLocaleString('sl-SI')):'Povezava se preveri ob odprtju aplikacije.'} · Osveži stran za novo preverjanje.</div>`}
async function loadFootball(){try{const r=await fetch('/.netlify/functions/football-results',{cache:'no-store'});const x=await r.json();if(!r.ok||!x.ok)throw Error(x.message||'Vir trenutno ni dosegljiv');footballData={state:'ready',matches:Array.isArray(x.matches)?x.matches.map(normalizeFootball).filter(Boolean):[],updated:x.updated||new Date().toISOString(),message:''}}catch(e){footballData={state:'error',matches:[],updated:null,message:e.message||'Napaka pri povezavi'}}if(tab==='Rezultati')render()}


function liveCard(x){let on=tracked.includes(x.id);return `<article class="glass live-match"><div class="top"><span>${x.icon} ${esc(x.sport)}</span><span class="tag">DEMO · brez rezultata</span></div><h3>${esc(x.match)}</h3><div class="live-small">${esc(x.status)} · termin ni potrjen</div><div style="margin-top:14px"><button class="live-track ${on?'selected':''}" data-track="${x.id}">${on?'✓ Spremljam · odstrani':'+ Spremljaj'}</button></div></article>`}
function render(){document.getElementById('nav').innerHTML=navs.map(([icon,name])=>`<button data-tab="${name}" class="${tab===name?'active':''}"><span class="ico">${icon}</span>${name}</button>`).join('');document.getElementById('app').innerHTML=tab==='Domov'?home():tab==='Reprezentance'?teams():tab==='Klubi'?clubsPage():tab==='Koledar'?calendar():tab==='Športi'?sportsPage():tab==='Rezultati'?resultsPage():favorites()}
loadFootball();document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;q='';filter='Vsi';render();window.scrollTo(0,0)}else if(b.dataset.calendarSport){calendarSport=b.dataset.calendarSport;render()}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.sport){tab='Domov';filter=b.dataset.sport;q='';render();window.scrollTo(0,0)}else if(b.dataset.track){let id=b.dataset.track;tracked=tracked.includes(id)?tracked.filter(x=>x!==id):[...tracked,id];localStorage.setItem('ss-live-tracked',JSON.stringify(tracked));render()}else if(b.dataset.save){let id=b.dataset.save;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('ss-saved-v5',JSON.stringify(saved));render()}});document.addEventListener('change',e=>{if(e.target.id==='outside'){outside=e.target.checked;localStorage.setItem('ss-live-outside',String(outside));render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){q=e.target.value.toLowerCase();let pos=e.target.selectionStart;render();let i=document.getElementById('search');if(i){i.focus();i.setSelectionRange(pos,pos)}}});render();setTimeout(()=>{document.getElementById('splash').classList.add('hide');setTimeout(()=>document.getElementById('splash')?.remove(),500)},4000);
</script></body></html>
